name: Generar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilacion de APK
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar Codigo
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: 3. Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 4. Instalar dependencias de React
      run: npm install --legacy-peer-deps

    - name: 5. Compilar Web (Vite)
      run: npm run build
      env:
        CI: false
        VITE_CONFIG_NATIVE_IGNORE_WARNING: true

    - name: 6. Sincronizar Capacitor con Android
      run: npx cap sync android

    - name: 7. Dar permisos de ejecucion a Gradle
      run: chmod +x android/gradlew

    - name: 8. Compilar APK Nativo con Gradle
      run: cd android && ./gradlew assembleDebug

    - name: 9. Subir el APK final para Descarga
      uses: actions/upload-artifact@v4
      with:
        name: POS-Pre-Venta-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
