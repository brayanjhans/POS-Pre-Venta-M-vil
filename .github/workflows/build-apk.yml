name: Generar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Compilacion de APK
    runs-on: ubuntu-latest
    env:
      # Configurar en GitHub: Settings → Secrets and variables → Actions
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
    - name: 1. Descargar Codigo
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: 3. Instalar dependencias (exactas del package-lock)
      run: npm ci

    - name: 4. Verificar tipos y pruebas
      run: |
        npm run lint
        npm test

    - name: 5. Verificar configuracion de Supabase
      if: github.event_name != 'pull_request'
      run: |
        if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
          echo "::error::Faltan los secrets VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY"
          exit 1
        fi
        if ! echo "$VITE_SUPABASE_URL" | grep -Eq '^https://[^/]+\.supabase\.co/?$'; then
          echo "::error::VITE_SUPABASE_URL debe ser la URL del proyecto (https://xxxx.supabase.co), no la clave"
          exit 1
        fi
        case "$VITE_SUPABASE_ANON_KEY" in
          eyJ*|sb_publishable_*) ;;
          *) echo "::error::VITE_SUPABASE_ANON_KEY no parece una clave anon/publishable de Supabase"; exit 1 ;;
        esac

    - name: 6. Compilar Web (Vite)
      run: npm run build

    - name: 7. Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: gradle

    - name: 8. Sincronizar Capacitor con Android
      run: npx cap sync android

    - name: 9. Preparar keystore de firma (si existe)
      if: env.HAS_KEYSTORE == 'true'
      run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

    - name: 10. Compilar APK release firmado
      if: env.HAS_KEYSTORE == 'true'
      working-directory: android
      env:
        ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease
        mkdir -p ../apk && cp app/build/outputs/apk/release/app-release.apk "../apk/POS-PreVenta-v1.0.${VERSION_CODE}.apk"

    - name: 10b. Compilar APK debug (sin keystore configurado)
      if: env.HAS_KEYSTORE != 'true'
      working-directory: android
      run: |
        echo "::warning::Sin keystore: se genera un APK debug. Configure ANDROID_KEYSTORE_* para APKs de produccion."
        chmod +x gradlew
        ./gradlew assembleDebug
        mkdir -p ../apk && cp app/build/outputs/apk/debug/app-debug.apk "../apk/POS-PreVenta-debug-${VERSION_CODE}.apk"

    - name: 11. Subir el APK final para Descarga
      uses: actions/upload-artifact@v4
      with:
        name: POS-Pre-Venta-APK-${{ github.run_number }}
        path: apk/*.apk
